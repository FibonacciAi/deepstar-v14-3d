[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepstar-v14-3d"
version = "14.3.2"
description = "Isolated local-first 2D image to 3D Gaussian pipeline for Deepstar."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
deepstar3d = "deepstar_v14_3d.cli:main"

[tool.setuptools.package-data]
deepstar_v14_3d = ["web/*", "tools/*"]
